name: Vérification Etheria

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verify:
    image: node:24-bookworm-slim
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etheria
          POSTGRES_PASSWORD: etheria_test
          POSTGRES_DB: etheria_test
    env:
      TEST_DATABASE_URL: postgresql://etheria:etheria_test@postgres:5432/etheria_test
    steps:
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier les types TypeScript
        run: npm run typecheck

      - name: Compiler le projet
        run: npm run build

      - name: Exécuter les tests unitaires et PostgreSQL
        run: npm test
