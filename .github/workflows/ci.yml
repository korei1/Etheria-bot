name: Vérification du bot Etheria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, compilation et PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: etheria
          POSTGRES_PASSWORD: etheria_test
          POSTGRES_DB: etheria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etheria -d etheria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://etheria:etheria_test@localhost:5432/etheria_test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler le projet
        run: npm run build

      - name: Exécuter les tests unitaires et PostgreSQL
        run: npm test
